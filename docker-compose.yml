version: '3.8'

services:
  # PostgreSQL 数据库（生产环境）
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: evercog
      POSTGRES_USER: evercog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evercog_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evercog"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Evercog 应用
  evercog:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_PROVIDER=postgresql
      - DATABASE_URL=postgresql://evercog:${POSTGRES_PASSWORD:-evercog_password}@postgres:5432/evercog
      - JWT_SECRET=${JWT_SECRET}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres-data:
    driver: local
